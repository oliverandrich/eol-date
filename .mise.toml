[tools]
go = "1.26"
"go:github.com/mfridman/tparse" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
goreleaser = "latest"
"pipx:pre-commit" = "latest"

[tasks.build]
description = "Build binary to build/eol-date"
run = 'go build -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" -o build/eol-date ./cmd/eol-date'

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.vuln]
description = "Run vulnerability check"
run = "govulncheck ./..."

[tasks.fmt]
description = "Format all Go files"
run = [
    "gofmt -w .",
    "goimports -w .",
]

[tasks.tidy]
description = "Tidy module dependencies"
run = "go mod tidy"

[tasks.install]
description = "Install binary to $GOPATH/bin"
run = 'go install -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" ./cmd/eol-date'

[tasks.ci]
description = "Pre-push checks: build, lint, vuln, test"
depends = ["build", "lint", "vuln", "test-ci"]

[tasks.release]
description = "Build and publish a release via goreleaser (run from a tag)"
run = "goreleaser release --clean"
