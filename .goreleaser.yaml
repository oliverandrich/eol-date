version: 2
project_name: eol-date

builds:
  - main: ./cmd/eol-date
    binary: eol-date
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
      - goos: darwin
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Others
      order: 999

homebrew_casks:
  - name: eol-date
    homepage: https://github.com/oliverandrich/eol-date
    description: CLI tool to check end-of-life dates for software products using the endoflife.date API.
    binaries:
      - eol-date
    directory: Casks
    repository:
      owner: oliverandrich
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Oliver Andrich
      email: oliver@andrich.me
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/eol-date"]
          end

release:
  name_template: "{{.Tag}}"
  prerelease: auto
